<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tomas Wincent Franzén</title>
	<meta name="description" content="I'm building Cadova, a way to design 3D-printable objects in Swift code. I also make iOS apps, open source projects and things to print.">
	<meta property="og:title" content="Tomas Wincent Franzén">
	<meta property="og:description" content="I'm building Cadova, a way to design 3D-printable objects in Swift code. I also make iOS apps, open source projects and things to print.">
	<meta property="og:image" content="https://tomasf.se/face.png">
	<link rel="icon" href="face.png">
	<link rel="apple-touch-icon" href="face.png">
	<meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
	<style>
		:root {
			--bg: #f6f1ea;
			--card: #fffdfa;
			--text: #2a2520;
			--muted: #6f665c;
			--accent: #c2562b;
			--accent-soft: #f3dccd;
			--halo: #f1e2d3;
			--line: #e8dfd4;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #1b1916;
				--card: #24211d;
				--text: #f1ebe3;
				--muted: #a89e92;
				--accent: #f08a5d;
				--accent-soft: #4a2e22;
				--halo: #2f2a24;
				--line: #34302a;
			}
		}

		* { box-sizing: border-box; }

		html, body { height: 100%; }

		body {
			margin: 0;
			display: grid;
			place-items: center;
			padding: 32px 16px;
			background:
				radial-gradient(60rem 40rem at 50% -10%, var(--halo), transparent 70%),
				var(--bg);
			color: var(--text);
			font: 17px/1.6 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
			-webkit-font-smoothing: antialiased;
		}

		main {
			max-width: 38rem;
			text-align: center;
			animation: rise 0.6s cubic-bezier(.2,.8,.2,1) both;
		}

		.avatar {
			width: 200px;
			height: 200px;
			margin: 0 auto 8px;
			border-radius: 50%;
			background: var(--accent-soft);
			display: grid;
			place-items: center;
			box-shadow: 0 0 0 8px var(--card), 0 12px 40px rgba(60, 40, 20, 0.12);
			transition: transform 0.3s cubic-bezier(.3,1.6,.5,1);
		}

		.avatar:hover { transform: rotate(-6deg) scale(1.04); }

		.avatar img {
			width: 88%;
			height: 88%;
			margin-top: 6%;
		}

		h1 {
			margin: 28px 0 8px;
			font-size: clamp(1.7rem, 5vw, 2.2rem);
			font-weight: 650;
			letter-spacing: -0.02em;
			line-height: 1.2;
			text-wrap: balance;
		}

		p {
			margin: 0 0 28px;
			color: var(--muted);
			font-size: 1.1rem;
			text-wrap: balance;
		}

		p a {
			color: var(--text);
			text-decoration: underline;
			text-decoration-color: var(--accent);
			text-decoration-thickness: 2px;
			text-underline-offset: 4px;
			transition: color 0.15s;
		}

		p a:hover { color: var(--accent); }

		.email {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 10px 20px;
			border-radius: 999px;
			background: var(--card);
			border: 1px solid var(--line);
			color: var(--text);
			font-weight: 550;
			text-decoration: none;
			box-shadow: 0 2px 8px rgba(60, 40, 20, 0.06);
			transition: transform 0.15s, border-color 0.15s, color 0.15s;
		}

		.email:hover {
			transform: translateY(-2px);
			border-color: var(--accent);
			color: var(--accent);
		}

		.email svg { width: 18px; height: 18px; }

		@media (max-width: 600px) {
			.wide { display: none; }
		}

		@keyframes rise {
			from { opacity: 0; transform: translateY(12px); }
		}

		@media (prefers-reduced-motion: reduce) {
			main, .avatar, .email { animation: none; transition: none; }
		}
	</style>
</head>
<body>
	<main>
		<div class="avatar"><img src="face.png" alt="Cartoon portrait of Tomas"></div>
		<h1>Tomas Wincent Franzén</h1>
		<p>I'm building <a href="https://cadova.org">Cadova</a>, a way to design 3D‑printable objects in Swift code.<br class="wide"> I also make <a href="https://framna.com/">iOS apps</a>, <a href="https://github.com/tomasf">open source projects</a> and <a href="https://makerworld.com/en/@tomasf">things to print</a>.</p>
		<a class="email" href="mailto:tomas@tomasf.se">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
			tomas@tomasf.se
		</a>
	</main>
</body>
</html>
